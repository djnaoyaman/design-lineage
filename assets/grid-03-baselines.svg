<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" role="img" aria-labelledby="grid-03-baselines-title grid-03-baselines-desc"><title id="grid-03-baselines-title">解説図：行のリズムを、列を越えて揃える</title><desc id="grid-03-baselines-desc">等間隔の青い基準線上に、日本語本文を2列配置。右の列に図版が入っても、その下の本文は左の列と同じ行の高さに戻る。 このサイトが作成した例。実在する代表作品の図版ではありません。</desc><g font-family="Arial, 'Noto Sans CJK JP', 'Noto Sans JP', sans-serif"><rect x="0" y="0" width="1200" height="1080" fill="#f4f3ef"/><text x="52" y="65" font-size="28" fill="#323df1" font-weight="400">GRID SYSTEMS / 03</text><text x="52" y="138" font-size="54" fill="#202121" font-weight="500">行のリズムを、列を越えて揃える</text><text x="52" y="196" font-size="32" fill="#63655f" font-weight="400">共通の行送りで、日本語本文の高さを合わせる。</text><rect x="52" y="276" width="1096" height="590" fill="#fff" stroke="#cdcdc7" stroke-width="2"/><line x1="78" y1="380" x2="1120" y2="380" stroke="#323df1" stroke-width="1"/><line x1="78" y1="440" x2="1120" y2="440" stroke="#323df1" stroke-width="1"/><line x1="78" y1="500" x2="1120" y2="500" stroke="#323df1" stroke-width="1"/><line x1="78" y1="560" x2="1120" y2="560" stroke="#323df1" stroke-width="1"/><line x1="78" y1="620" x2="1120" y2="620" stroke="#323df1" stroke-width="1"/><line x1="78" y1="680" x2="1120" y2="680" stroke="#323df1" stroke-width="1"/><line x1="78" y1="740" x2="1120" y2="740" stroke="#323df1" stroke-width="1"/><line x1="78" y1="800" x2="1120" y2="800" stroke="#323df1" stroke-width="1"/><text x="90" y="345" font-size="34" fill="#63655f" font-weight="400">本文の行送り：共通</text><text x="90" y="440" font-size="38" fill="#202121" font-weight="400">余白を設ける。</text><text x="90" y="500" font-size="38" fill="#202121" font-weight="400">文字を並べる。</text><text x="90" y="560" font-size="38" fill="#202121" font-weight="400">行を重ねる。</text><text x="90" y="620" font-size="38" fill="#202121" font-weight="400">流れをつくる。</text><text x="90" y="740" font-size="38" fill="#202121" font-weight="400">段落が変わっても</text><text x="90" y="800" font-size="38" fill="#202121" font-weight="400">基準を共有する。</text><rect x="646" y="320" width="450" height="240" fill="#deded7"/><text x="646" y="620" font-size="38" fill="#202121" font-weight="400">図版の下の本文も</text><text x="646" y="680" font-size="38" fill="#202121" font-weight="400">同じ間隔で並べる。</text><text x="646" y="740" font-size="38" fill="#202121" font-weight="400">隣の列と行の高さを</text><text x="646" y="800" font-size="38" fill="#202121" font-weight="400">揃えて読ませる。</text><line x1="592" y1="620" x2="592" y2="680" stroke="#202121" stroke-width="3"/><line x1="580" y1="620" x2="604" y2="620" stroke="#202121" stroke-width="3"/><line x1="580" y1="680" x2="604" y2="680" stroke="#202121" stroke-width="3"/><line x1="52" y1="913" x2="1148" y2="913" stroke="#202121" stroke-width="2"/><text x="52" y="969" font-size="34" fill="#202121" font-weight="400">見るところ → 青い基準線と、左右の本文</text><text x="52" y="1038" font-size="31" fill="#63655f" font-weight="400">解説図｜このサイトが作成した例</text></g></svg>