<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc"><title id="title">FUTURISM｜時間と軌跡：このサイトが作成した比較解説図</title><desc id="desc">同じ抽象的な円盤で、静止と移動の見せ方を比較する。。実在作品の複製や特定作家の模倣ではありません。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1200" height="1000" fill="#f5f0e5" stroke="none" stroke-width="2"/><text x="48" y="63" font-size="36" fill="#172c39" font-weight="600" text-anchor="start">解説図｜このサイトが作成した比較例</text><text x="48" y="128" font-size="46" fill="#172c39" font-weight="700" text-anchor="start">FUTURISM｜時間と軌跡</text><text x="48" y="182" font-size="30" fill="#172c39" font-weight="400" text-anchor="start">同じ抽象的な円盤で、静止と移動の見せ方を比較する。</text><path d="M48 210 L1152 210" fill="none" stroke="#172c39" stroke-width="2" stroke-dasharray=""/><rect x="48" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><rect x="616" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><text x="72" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">A  一瞬を示す</text><text x="640" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">B  複数の時点を示す</text><path d="M96 655 L536 655" fill="none" stroke="#27617b" stroke-width="3" stroke-dasharray=""/><circle cx="302" cy="494" r="65" fill="#bd513f" stroke="none" stroke-width="2" opacity="1"/><text x="316" y="733" font-size="32" fill="#172c39" font-weight="400" text-anchor="middle">一つの位置</text><path d="M664 655 L1104 655" fill="none" stroke="#27617b" stroke-width="3" stroke-dasharray=""/><circle cx="716" cy="582" r="45" fill="#bd513f" stroke="none" stroke-width="2" opacity="0.2"/><path d="M716 641 L716 655" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="4 7"/><circle cx="786" cy="552" r="45" fill="#bd513f" stroke="none" stroke-width="2" opacity="0.4"/><path d="M786 611 L786 655" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="4 7"/><circle cx="856" cy="513" r="45" fill="#bd513f" stroke="none" stroke-width="2" opacity="0.6"/><path d="M856 572 L856 655" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="4 7"/><circle cx="926" cy="464" r="45" fill="#bd513f" stroke="none" stroke-width="2" opacity="0.8"/><path d="M926 523 L926 655" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="4 7"/><circle cx="996" cy="405" r="45" fill="#bd513f" stroke="none" stroke-width="2" opacity="1.0"/><path d="M996 464 L996 655" fill="none" stroke="#27617b" stroke-width="2" stroke-dasharray="4 7"/><path d="M694 588 Q850 535 1048 348" fill="none" stroke="#172c39" stroke-width="4"/><path d="M1017 359 L1048 348 L1042 381" fill="none" stroke="#172c39" stroke-width="4"/><text x="884" y="733" font-size="32" fill="#172c39" font-weight="400" text-anchor="middle">時間順に位置を重ねる</text><text x="48" y="838" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">比較する点：反復／位置の変化／濃淡の順序</text><text x="48" y="885" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">Bの円は別々の物体ではなく、一つの円盤の時間変化。</text><text x="48" y="960" font-size="28" fill="#172c39" font-weight="400" text-anchor="start">実在する歴史的代表作ではなく、構成の違いを学ぶための創作です。</text></g></svg>