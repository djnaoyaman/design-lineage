<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc"><title id="title">ART DECO｜尺度と軸：このサイトが作成した比較解説図</title><desc id="desc">同じ架空の船と文字で、視線の集め方を比較する。。実在作品の複製や特定作家の模倣ではありません。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1200" height="1000" fill="#f5f0e5" stroke="none" stroke-width="2"/><text x="48" y="63" font-size="36" fill="#172c39" font-weight="600" text-anchor="start">解説図｜このサイトが作成した比較例</text><text x="48" y="128" font-size="46" fill="#172c39" font-weight="700" text-anchor="start">ART DECO｜尺度と軸</text><text x="48" y="182" font-size="30" fill="#172c39" font-weight="400" text-anchor="start">同じ架空の船と文字で、視線の集め方を比較する。</text><path d="M48 210 L1152 210" fill="none" stroke="#172c39" stroke-width="2" stroke-dasharray=""/><rect x="48" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><rect x="616" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><text x="72" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">A  均等な大きさ</text><text x="640" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">B  船を拡大・軸を強調</text><g transform="translate(145 462) scale(1.0)"><rect x="102" y="0" width="110" height="34" fill="#27617b" stroke="none" stroke-width="2"/><rect x="146" y="-28" width="26" height="28" fill="#bd513f" stroke="none" stroke-width="2"/><path d="M0 40 H320 L270 100 H60 Z" fill="#172c39"/><path d="M34 126 L292 126" fill="none" stroke="#27617b" stroke-width="5" stroke-dasharray=""/></g><text x="316" y="388" font-size="42" fill="#172c39" font-weight="600" text-anchor="middle">HARBOR</text><text x="316" y="665" font-size="42" fill="#172c39" font-weight="600" text-anchor="middle">FERRY</text><path d="M884 325 L884 740" fill="none" stroke="#bd513f" stroke-width="2" stroke-dasharray="6 9"/><g transform="translate(646 475) scale(1.484375)"><rect x="102" y="0" width="110" height="34" fill="#27617b" stroke="none" stroke-width="2"/><rect x="146" y="-28" width="26" height="28" fill="#bd513f" stroke="none" stroke-width="2"/><path d="M0 40 H320 L270 100 H60 Z" fill="#172c39"/><path d="M34 126 L292 126" fill="none" stroke="#27617b" stroke-width="5" stroke-dasharray=""/></g><text x="884" y="398" font-size="66" fill="#172c39" font-weight="700" text-anchor="middle">HARBOR</text><text x="884" y="714" font-size="58" fill="#172c39" font-weight="700" text-anchor="middle">FERRY</text><text x="48" y="838" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">比較する点：図像の大きさ／中心軸／文字との比率</text><text x="48" y="885" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">Bでは船を大きくし、上下の文字を中心軸にそろえた。</text><text x="48" y="960" font-size="28" fill="#172c39" font-weight="400" text-anchor="start">実在する歴史的代表作ではなく、構成の違いを学ぶための創作です。</text></g></svg>