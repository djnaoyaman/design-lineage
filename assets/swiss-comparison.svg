<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc"><title id="title">SWISS STYLE｜整列と余白：このサイトが作成した比較解説図</title><desc id="desc">同じ文字と長方形で、情報の読み順を比較する。。実在作品の複製や特定作家の模倣ではありません。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1200" height="1000" fill="#f5f0e5" stroke="none" stroke-width="2"/><text x="48" y="63" font-size="36" fill="#172c39" font-weight="600" text-anchor="start">解説図｜このサイトが作成した比較例</text><text x="48" y="128" font-size="46" fill="#172c39" font-weight="700" text-anchor="start">SWISS STYLE｜整列と余白</text><text x="48" y="182" font-size="30" fill="#172c39" font-weight="400" text-anchor="start">同じ文字と長方形で、情報の読み順を比較する。</text><path d="M48 210 L1152 210" fill="none" stroke="#172c39" stroke-width="2" stroke-dasharray=""/><rect x="48" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><rect x="616" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><text x="72" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">A  配置と強さを分散</text><text x="640" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">B  左端と強弱を整理</text><text x="93" y="390" font-size="43" fill="#172c39" font-weight="500" text-anchor="start">FORM / 01</text><rect x="213" y="427" width="264" height="106" fill="#27617b" stroke="none" stroke-width="2"/><text x="132" y="589" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">見る・読む・つくる</text><text x="264" y="646" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">OPEN STUDIO</text><text x="101" y="724" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">入場無料</text><path d="M674 325 L674 749" fill="none" stroke="#bd513f" stroke-width="2" stroke-dasharray="6 9"/><text x="694" y="397" font-size="56" fill="#172c39" font-weight="700" text-anchor="start">FORM / 01</text><text x="694" y="460" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">見る・読む・つくる</text><rect x="694" y="500" width="188" height="90" fill="#27617b" stroke="none" stroke-width="2"/><text x="694" y="675" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">OPEN STUDIO</text><text x="694" y="724" font-size="28" fill="#172c39" font-weight="400" text-anchor="start">入場無料</text><text x="48" y="838" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">比較する点：左端の整列／余白／文字サイズの階層</text><text x="48" y="885" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">Bの赤線は比較用の補助線。歴史的な実測グリッドではない。</text><text x="48" y="960" font-size="28" fill="#172c39" font-weight="400" text-anchor="start">実在する歴史的代表作ではなく、構成の違いを学ぶための創作です。</text></g></svg>