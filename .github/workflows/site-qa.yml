name: Site QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8793 > /tmp/site-http.log 2>&1 &
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-qa
          path: qa-artifacts
