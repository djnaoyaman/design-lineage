"662" y="594" width="128" height="7" fill="#202121"/><rect x="662" y="625" width="128" height="7" fill="#202121"/><rect x="662" y="656" width="89.6" height="7" fill="#202121"/><rect x="814" y="335" width="128" height="70" fill="#323df1"/><rect x="814" y="439" width="128" height="7" fill="#202121"/><rect x="814" y="470" width="128" height="7" fill="#202121"/><rect x="814" y="501" width="128" height="7" fill="#202121"/><rect x="814" y="532" width="128" height="7" fill="#202121"/><rect x="814" y="563" width="128" height="7" fill="#202121"/><rect x="814" y="594" width="128" height="7" fill="#202121"/><rect x="814" y="625" width="128" height="7" fill="#202121"/><rect x="814" y="656" width="89.6" height="7" fill="#202121"/><rect x="966" y="335" width="128" height="70" fill="#323df1"/><rect x="966" y="439" width="128" height="7" fill="#202121"/><rect x="966" y="470" width="128" height="7" fill="#202121"/><rect x="966" y="501" width="128" height="7" fill="#202121"/><rect x="966" y="532" width="128" height="7" fill="#202121"/><rect x="966" y="563" width="128" height="7" fill="#202121"/><rect x="966" y="594" width="128" height="7" fill="#202121"/><rect x="966" y="625" width="128" height="7" fill="#202121"/><rect x="966" y="656" width="89.6" height="7" fill="#202121"/><text x="82" y="805" font-size="32" fill="#63655f" font-weight="400">ひと続きに読む</text><text x="662" y="805" font-size="32" fill="#63655f" font-weight="400">話題を分けて読む</text><line x1="52" y1="913" x2="1148" y2="913" stroke="#202121" stroke-width="2"/><text x="52" y="969" font-size="34" fill="#202121" font-weight="400">見るところ → 列幅と、列の間の余白</text><text x="52" y="1038" font-size="31" fill="#63655f" font-weight="400">解説図｜このサイトが作成した例</text></g></svg>