<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="title desc"><title id="title">POSTMODERNISM｜機能と記号：このサイトが作成した比較解説図</title><desc id="desc">同じ架空の三段キャビネットで、表情の違いを比較する。。実在作品の複製や特定作家の模倣ではありません。</desc><g font-family="Noto Sans CJK JP, sans-serif"><rect x="0" y="0" width="1200" height="1000" fill="#f5f0e5" stroke="none" stroke-width="2"/><text x="48" y="63" font-size="36" fill="#172c39" font-weight="600" text-anchor="start">解説図｜このサイトが作成した比較例</text><text x="48" y="128" font-size="46" fill="#172c39" font-weight="700" text-anchor="start">POSTMODERNISM｜機能と記号</text><text x="48" y="182" font-size="30" fill="#172c39" font-weight="400" text-anchor="start">同じ架空の三段キャビネットで、表情の違いを比較する。</text><path d="M48 210 L1152 210" fill="none" stroke="#172c39" stroke-width="2" stroke-dasharray=""/><rect x="48" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><rect x="616" y="244" width="536" height="536" fill="#fffdf7" stroke="#e3e0d6" stroke-width="2"/><text x="72" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">A  収納の形を明確に</text><text x="640" y="292" font-size="32" fill="#172c39" font-weight="600" text-anchor="start">B  遊びのある形を加える</text><rect x="191" y="405" width="250" height="272" fill="#27617b" stroke="none" stroke-width="2"/><rect x="204" y="419" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="316" cy="453" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="204" y="502" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="316" cy="536" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="204" y="585" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="316" cy="619" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="213" y="677" width="26" height="49" fill="#172c39" stroke="none" stroke-width="2"/><rect x="393" y="677" width="26" height="49" fill="#172c39" stroke="none" stroke-width="2"/><text x="316" y="749" font-size="32" fill="#172c39" font-weight="400" text-anchor="middle">三段の収納</text><rect x="759" y="405" width="250" height="272" fill="#27617b" stroke="none" stroke-width="2"/><rect x="772" y="419" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="884" cy="453" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="772" y="502" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="884" cy="536" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="772" y="585" width="224" height="70" fill="#f5f0e5" stroke="#172c39" stroke-width="2"/><circle cx="884" cy="619" r="8" fill="#172c39" stroke="none" stroke-width="2" opacity="1"/><rect x="781" y="677" width="26" height="49" fill="#172c39" stroke="none" stroke-width="2"/><rect x="961" y="677" width="26" height="49" fill="#172c39" stroke="none" stroke-width="2"/><circle cx="756" cy="393" r="43" fill="#bd513f" stroke="none" stroke-width="2" opacity="1"/><path d="M940 405 L1000 330 L1050 405 Z" fill="#172c39"/><rect x="817" y="354" width="83" height="34" fill="#bd513f" stroke="none" stroke-width="2"/><text x="884" y="749" font-size="30" fill="#172c39" font-weight="400" text-anchor="middle">同じ収納 ＋ 視覚的な記号</text><text x="48" y="838" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">比較する点：収納としての機能／色と形の意味</text><text x="48" y="885" font-size="32" fill="#172c39" font-weight="400" text-anchor="start">Bは収納部分を変えず、円・三角・色で別の表情を与えた。</text><text x="48" y="960" font-size="28" fill="#172c39" font-weight="400" text-anchor="start">実在する歴史的代表作ではなく、構成の違いを学ぶための創作です。</text></g></svg>